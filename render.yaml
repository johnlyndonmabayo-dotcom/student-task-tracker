services:
  - type: web
    name: student-task-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-task-tracker-db
          property: connectionString

databases:
  - name: student-task-tracker-db
    plan: free
